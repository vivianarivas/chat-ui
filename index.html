<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat IA Local</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="chat-container">
        <h1>Asistente IA Local</h1>
        <div id="chat-box" class="chat-box"></div>
        <form id="chat-form" class="chat-form">
            <textarea id="user-input" placeholder="Escribí tu pregunta..." autocomplete="off" rows="1"></textarea>
            <button type="submit">Enviar</button>
        </form>
        <h2>Subir archivo</h2>
        <form class="upload-form" id="upload-form">            
            <label for="file-input" class="upload-label">📁 Seleccionar archivo</label>
            <input type="file" id="file-input" required>
            
            <input type="text" id="topic-input" placeholder="Tema del archivo (topic)" required>
            <button type="submit">Subir y procesar</button>
        </form>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
