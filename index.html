<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat IA Local</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="chat-container">
        <h1>Asistente IA Local</h1>
        <div id="chat-box" class="chat-box"></div>
        <form id="chat-form" class="chat-form">
            <textarea id="user-input" placeholder="Escribí tu pregunta..." autocomplete="off" rows="1"></textarea>
            <button type="submit">Enviar</button>
        </form>
        <h2>Subir archivo</h2>
        <form class="upload-form" id="upload-form">            
            <label for="file-input" class="upload-label">📁 Seleccionar archivo</label>
            <input type="file" id="file-input" required>

            <!-- Mostar el nombre del archivo -->
            <div id="file-name" class="file-name"></div>
            
            <input type="text" id="topic-input" placeholder="Tema del archivo (topic)" required>
            <button type="submit">Subir y procesar</button>
        </form>

        <!-- Estado de subida con spinner -->
        <div id="upload-status" class="upload-status" style="display: none;">
            <div class="spinner"></div>
            <span class="status-text">Subiendo archivo...</span>
        </div>
    </div>
    <script>
    document.getElementById('file-input').addEventListener('change', function () {
        const fileName = this.files[0] ? this.files[0].name : 'Ningún archivo seleccionado';
        document.getElementById('file-name').textContent = fileName;
    });
    </script>
    <script src="js/app.js"></script>
</body>
</html>
